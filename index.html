<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cricket Legends — Brain Rehab Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Graduate&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background: linear-gradient(135deg, #1a3a2a 0%, #0f2818 100%);
      color: #f5f5f5;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container { max-width: 700px; margin: 0 auto; }
    
    h1 { 
      font-family: 'Graduate', serif;
      text-align: center;
      font-size: 2.5rem;
      margin: 20px 0;
      color: #d4af37;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    .screen { display: none; }
    .screen.active { display: block; }
    
    button {
      background: #2d5a3d;
      color: #d4af37;
      border: 2px solid #d4af37;
      padding: 15px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
      font-weight: bold;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    
    button:active { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .scoreboard {
      background: #2d5a3d;
      border: 3px solid #d4af37;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: center;
    }
    
    .score-value {
      font-family: 'Graduate', serif;
      font-size: 2.5rem;
      color: #d4af37;
      margin: 10px 0;
    }
    
    .grid { 
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    
    .card {
      background: #2d5a3d;
      border: 2px solid #d4af37;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      font-size: 0.95rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    .card:active { opacity: 0.8; }
    .card.flipped { background: #d4af37; color: #1a3a2a; font-weight: bold; }
    .card.matched { opacity: 0.5; }
    
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .card.matched {
      animation: pulse 0.3s ease;
    }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }
    
    .topbar button { width: auto; margin: 0; }
    
    .level-title {
      flex: 1;
      text-align: center;
      font-family: 'Graduate', serif;
      font-size: 1.2rem;
      color: #d4af37;
    }
    
    .timer {
      font-family: 'Graduate', serif;
      font-size: 1.2rem;
      color: #d4af37;
    }
    
    .completion-screen {
      text-align: center;
      margin: 40px 0;
    }
    
    .completion-text {
      font-size: 1.5rem;
      margin: 20px 0;
      color: #d4af37;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #d4af37;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏏 CRICKET LEGENDS</h1>
    
    <!-- LOADING SCREEN -->
    <div class="screen active" id="loading">
      <div class="loading">
        <p>Loading questions from Supabase...</p>
        <p style="margin-top: 20px; font-size: 3rem;">🏏</p>
      </div>
    </div>
    
    <!-- HOME SCREEN -->
    <div class="screen" id="home">
      <div class="scoreboard">
        <div>Score: <span class="score-value" id="score">0</span></div>
        <div>Levels: <span id="levels-done">0/5</span></div>
      </div>
      
      <button onclick="startLevel(1)">Level 1 — Easy</button>
      <button onclick="startLevel(2)">Level 2 — Medium</button>
      <button onclick="startLevel(3)">Level 3 — Hard</button>
      <button onclick="startLevel(4)">Level 4 — Expert</button>
      <button onclick="startLevel(5)">Level 5 — Legend</button>
    </div>
    
    <!-- GAME SCREEN -->
    <div class="screen" id="game">
      <div class="topbar">
        <button onclick="goHome()">← Home</button>
        <span class="level-title" id="level-title">Level 1</span>
        <span class="timer">⏱ <span id="timer">0:00</span></span>
      </div>
      
      <div class="scoreboard">
        <div>Score: <span class="score-value" id="game-score">0</span></div>
      </div>
      
      <div class="grid" id="grid"></div>
    </div>
    
    <!-- COMPLETION SCREEN -->
    <div class="screen" id="completion">
      <div class="completion-screen">
        <h2>✅ Level Complete!</h2>
        <div class="completion-text" id="completion-time"></div>
        <div class="completion-text">Score: <span id="completion-score">0</span></div>
        <button onclick="nextLevel()">Next Level →</button>
        <button onclick="goHome()">← Home</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase config
    const SUPABASE_URL = 'https://tfqnadbvsbfidwpplbuj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0wvMZ9c9xg8Gcb7gzdvu8Q_Gw8gXCKe';
    
    let gameState = {
      score: 0,
      currentLevel: 0,
      levelsDone: [],
      timerStart: 0,
      timerInterval: null,
      questionsBank: {}
    };
    
    // Fetch questions from Supabase on page load
    async function loadQuestions() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/questions?select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Content-Type': 'application/json'
            }
          }
        );
        
        if (!response.ok) throw new Error('Failed to fetch');
        
        const data = await response.json();
        
        // Organize by level
        gameState.questionsBank = {
          1: data.filter(q => q.level === 1),
          2: data.filter(q => q.level === 2),
          3: data.filter(q => q.level === 3),
          4: data.filter(q => q.level === 4),
          5: data.filter(q => q.level === 5)
        };
        
        console.log('✅ Loaded', data.length, 'questions from Supabase');
        showScreen('home');
      } catch (err) {
        console.error('Error loading questions:', err);
        document.querySelector('.loading').innerHTML = '<p style="color: red;">Error loading questions. Please refresh.</p>';
      }
    }

    function getRandomQuestions(level, count = 4) {
      const allQuestions = gameState.questionsBank[level] || [];
      const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, Math.min(count, allQuestions.length));
    }

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 600;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    }
    
    function playCelebration() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.15);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.15);
      });
    }
    
    function addConfetti() {
      const card = document.createElement('div');
      card.textContent = '✨';
      card.style.position = 'fixed';
      card.style.left = Math.random() * 100 + '%';
      card.style.top = '50%';
      card.style.fontSize = '2rem';
      card.style.pointerEvents = 'none';
      card.style.animation = 'fall 1s ease-in forwards';
      document.body.appendChild(card);
      setTimeout(() => card.remove(), 1000);
    }

    function startTimer() {
      gameState.timerStart = Date.now();
      if (gameState.timerInterval) clearInterval(gameState.timerInterval);
      gameState.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - gameState.timerStart) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      }, 100);
    }

    function stopTimer() {
      if (gameState.timerInterval) clearInterval(gameState.timerInterval);
    }

    function startLevel(level) {
      gameState.currentLevel = level;
      const pairs = getRandomQuestions(level, 4);
      const cards = [];
      
      pairs.forEach((pair, idx) => {
        cards.push({ id: idx, text: pair.question, type: 'q', bg: pair.emoji });
        cards.push({ id: idx, text: pair.answer, type: 'a', bg: pair.emoji });
      });
      
      cards.sort(() => Math.random() - 0.5);
      
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      cards.forEach((card) => {
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.textContent = '?';
        btn.dataset.id = card.id;
        btn.dataset.text = card.text;
        btn.dataset.bg = card.bg;
        btn.style.backgroundColor = '#2d5a3d';
        btn.onclick = () => flipCard(btn);
        grid.appendChild(btn);
      });
      
      document.getElementById('level-title').textContent = `Level ${level}`;
      document.getElementById('game-score').textContent = gameState.score;
      document.getElementById('timer').textContent = '0:00';
      
      showScreen('game');
      startTimer();
    }

    let flipped = [];
    let matched = 0;
    
    function flipCard(btn) {
      if (btn.classList.contains('flipped') || btn.classList.contains('matched') || flipped.length >= 2) return;
      
      btn.classList.add('flipped');
      btn.textContent = btn.dataset.text;
      btn.style.backgroundColor = '#d4af37';
      flipped.push(btn);
      
      if (flipped.length === 2) {
        if (flipped[0].dataset.id === flipped[1].dataset.id) {
          flipped[0].classList.add('matched');
          flipped[1].classList.add('matched');
          playBeep();
          addConfetti();
          addConfetti();
          gameState.score += 50;
          document.getElementById('game-score').textContent = gameState.score;
          matched++;
          
          const totalCards = document.querySelectorAll('.card').length / 2;
          if (matched === totalCards) {
            stopTimer();
            setTimeout(showCompletion, 800);
          }
          
          flipped = [];
        } else {
          setTimeout(() => {
            flipped[0].classList.remove('flipped');
            flipped[1].classList.remove('flipped');
            flipped[0].textContent = '?';
            flipped[1].textContent = '?';
            flipped[0].style.backgroundColor = '#2d5a3d';
            flipped[1].style.backgroundColor = '#2d5a3d';
            flipped = [];
          }, 1000);
        }
      }
    }

    function showCompletion() {
      playCelebration();
      const elapsed = Math.floor((Date.now() - gameState.timerStart) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      
      document.getElementById('completion-time').textContent = `Time: ${mins}m ${secs}s`;
      document.getElementById('completion-score').textContent = gameState.score;
      
      if (!gameState.levelsDone.includes(gameState.currentLevel)) {
        gameState.levelsDone.push(gameState.currentLevel);
      }
      
      document.getElementById('levels-done').textContent = `${gameState.levelsDone.length}/5`;
      
      showScreen('completion');
    }

    function nextLevel() {
      if (gameState.currentLevel < 5) {
        matched = 0;
        startLevel(gameState.currentLevel + 1);
      } else {
        goHome();
      }
    }

    function goHome() {
      stopTimer();
      matched = 0;
      flipped = [];
      document.getElementById('score').textContent = gameState.score;
      document.getElementById('levels-done').textContent = `${gameState.levelsDone.length}/5`;
      showScreen('home');
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // Load questions on page load
    window.addEventListener('DOMContentLoaded', loadQuestions);
  </script>
</body>
</html>
